name: CI DevOps Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer dépendances
        run: pip install flask

      - name: Build Docker image
        run: docker build -t devops-ai-app .

      - name: Run container
        run: docker run -d -p 5000:5000 devops-ai-app

      - name: Vérifier conteneur
        run: docker ps

      - name: Générer log
        run: echo "ERROR:root:division by zero" >> app.log

      - name: Analyse IA
        run: python analyse_logs.py

